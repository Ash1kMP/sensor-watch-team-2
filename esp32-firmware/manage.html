<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage</title>
  <style>
    body{font-family:Arial,sans-serif;text-align:center;background:#f4f4f4;margin:0}
    h1{color:#333}
    .button{background:#3498db;color:#fff;padding:10px 20px;text-decoration:none;border-radius:5px;display:inline-block;margin:5px;border:none;cursor:pointer}
    .button:hover{background:#2377a5}
    #msg{margin-top:10px;color:#374151}
  </style>
</head>
<body>
  <h1>Manage</h1>
  <div>
    <a href="/login" class="button">OTA Update</a>
    <a href="/fs" class="button">Filesystem</a>
    <a href="/labels" class="button">Labels</a>
    <a href="/connectivity" class="button">Connectivity</a>
    <a href="/" class="button">Back</a>
    <button id="toggleCapture" class="button" onclick="toggleCapture()">Pause Data Collection</button>
    <button class="button" onclick="rebootDevice()">Reboot Device</button>
  </div>
  <div id="msg"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    function note(t){ $("msg").textContent = t || ""; }

    function setToggleFromStatus(){
      fetch('/status?v='+Date.now())
        .then(r=>r.json())
        .then(s=>{
          const b = $('toggleCapture');
          if(!b) return;
          // if your firmware returns status:'Paused' when capture is off
          b.textContent = (s && s.status === 'Paused') ? 'Start Data Collection' : 'Pause Data Collection';
        })
        .catch(()=>{});
    }

    function toggleCapture(){
      const b = $('toggleCapture');
      const pausing = (b.textContent === 'Pause Data Collection');
      const url = pausing ? '/stop-capture' : '/start-capture';
      note(pausing ? 'Pausing…' : 'Starting…');
      fetch(url, { method:'POST' })
        .then(r=>r.text())
        .then(()=>{ b.textContent = pausing ? 'Start Data Collection' : 'Pause Data Collection'; note(''); })
        .catch(err=>{ console.error(err); note('Action failed'); });
    }

    function rebootDevice(){
      note('Rebooting…');
      fetch('/restart', { method:'POST' })
        .then(r=>r.text())
        .then(()=>{ note('Device rebooting…'); })
        .catch(err=>{ console.error(err); note('Reboot failed'); });
    }

    // Initialize button label based on current status
    setToggleFromStatus();
  </script>
</body>
</html>
