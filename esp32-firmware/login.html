<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    body{font-family:Arial,sans-serif;text-align:center;background:#f4f4f4;margin:0}
    h1{color:#333}
    .box{max-width:320px;margin:40px auto;padding:20px;background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
    .box input{width:92%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:5px;font-size:1em}
    .box input[type=button]{width:96%;background:#3498db;color:#fff;border:none;cursor:pointer}
    .box input[type=button]:hover{background:#2377a5}
  </style>
</head>
<body>
  <h1>Login</h1>
  <div class="box">
    <form id="loginForm">
      <input name="userid" placeholder="User ID" type="text" autocomplete="username" />
      <input name="pwd"   placeholder="Password" type="password" autocomplete="current-password" />
      <input type="button" value="Login" id="loginBtn" />
    </form>
  </div>
  <script>
    function check(f){
      if(f.userid.value==='admin' && f.pwd.value==='admin'){
        // keep original destination
        location.href='/serverIndex';
      }else{
        alert('Error: Incorrect Username or Password');
      }
    }
    // wire up button and Enter key
    const form=document.getElementById('loginForm');
    const btn=document.getElementById('loginBtn');
    btn.addEventListener('click', ()=>check(form));
    form.addEventListener('submit', (e)=>{ e.preventDefault(); check(form); });
  </script>
</body>
</html>
